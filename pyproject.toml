[project]
name = "ai_oversight"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24.0",
    "python-pptx>=1.0.0",
    "pydantic>=2.8.0",
    "typer>=0.12.0",
]

[project.scripts]
ai_oversight = "ai_oversight.cli:app"

[project.optional-dependencies]
docling = ["docling>=2.0.0"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ipykernel>=6.30.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_oversight"]
